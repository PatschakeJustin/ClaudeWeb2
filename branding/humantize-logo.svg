<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#FF5D73"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DDBD9"/>
      <stop offset="1" stop-color="#2E9CCA"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <!-- left person: head + body (left stem of the H) -->
  <circle cx="38" cy="33" r="6" fill="url(#l)"/>
  <path d="M33,44 a5,5 0 0 1 10,0 v34 a5,5 0 0 1 -10,0z" fill="url(#l)"/>
  <!-- right person -->
  <circle cx="70" cy="33" r="6" fill="url(#r)"/>
  <path d="M65,44 a5,5 0 0 1 10,0 v34 a5,5 0 0 1 -10,0z" fill="url(#r)"/>
  <!-- arms reaching to each other = crossbar of the H -->
  <path d="M43,56 C49,56 50,62 54,62" stroke="url(#l)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M65,56 C59,56 58,62 54,62" stroke="url(#r)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- code spark between the hands -->
  <path d="M50,71 l-3,3 l3,3 M58,71 l3,3 l-3,3" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

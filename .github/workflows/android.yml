name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (SSH, Nextcloud, Claude agent)
        run: ./gradlew :core:test

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease 2>&1 | tee build.log || { echo "=== ERRORS ==="; grep -E "^e: |error:|What went wrong" -A2 build.log | head -100; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk Humantize-DevApp.apk

      - name: Check Android 7 compatibility (lint NewApi)
        continue-on-error: true
        run: |
          ./gradlew :app:lintRelease -q > /dev/null 2>&1 || true
          R=$(ls app/build/reports/lint-results-release.xml 2>/dev/null | head -1)
          if [ -n "$R" ]; then
            python3 - "$R" <<'PY'
          import sys, xml.etree.ElementTree as ET
          issues = [i for i in ET.parse(sys.argv[1]).getroot() if i.get("id") in ("NewApi", "InlinedApi")]
          print(f"NewApi/InlinedApi findings: {len(issues)}")
          for i in issues[:60]:
              loc = i.find("location")
              print("-", i.get("id"), "|", i.get("message"), "|", loc.get("file").split("/src/")[-1] if loc is not None else "", loc.get("line") if loc is not None else "")
          PY
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Humantize-DevApp-apk
          path: Humantize-DevApp.apk
          if-no-files-found: error

      # Fixed download link: https://github.com/<owner>/<repo>/releases/download/latest/Humantize-DevApp.apk
      - name: Publish "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          printf '{"versionCode": %d, "versionName": "0.5.%d", "apk": "Humantize-DevApp.apk", "notes": "%s"}\n' \
            $((100 + GITHUB_RUN_NUMBER)) "$GITHUB_RUN_NUMBER" "$NOTES" > version.json
          cat version.json
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Humantize-DevApp.apk version.json --prerelease --target "$GITHUB_SHA" \
            --title "Humantize DevApp Mobile (neuester Build)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7} (Branch ${GITHUB_REF_NAME}). APK auf dem Android-Gerät öffnen und installieren."

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

  # Starts the app in Android emulators (7.0, 11, 14), opens every tab and fails on crashes.
  # Screenshots and logcat are attached to the "latest" release (smoke-*.png / smoke-*.txt).
  smoke:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [24, 30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Humantize-DevApp-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 24 && 'default' || 'google_apis' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke-test.sh ${{ matrix.api }}

      - name: Attach screenshots and logcat to the release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la smoke || exit 0
          cd smoke
          for f in *; do mv "$f" "smoke-$f"; done
          gh release upload latest smoke-* --clobber -R "$GITHUB_REPOSITORY" || true


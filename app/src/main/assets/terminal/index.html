<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #000000; overflow: hidden; }
  #term { position: absolute; inset: 0; padding: 4px 4px 0 6px; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-web-links.js"></script>
<script>
  const TermClass = (window.Terminal && window.Terminal.Terminal) || window.Terminal;
  const FitClass = (window.FitAddon && window.FitAddon.FitAddon) || window.FitAddon;
  const LinksClass = (window.WebLinksAddon && window.WebLinksAddon.WebLinksAddon) || window.WebLinksAddon;
  const bridge = window.Bridge || { onInput() {}, onResize() {}, onReady() {}, openUrl() {} };

  const term = new TermClass({
    fontFamily: 'monospace',
    fontSize: 13,
    cursorBlink: true,
    scrollback: 10000,
    theme: { background: '#000000', foreground: '#f2e6d9', cursor: '#ff9c3d', selectionBackground: '#cc99cc66' },
  });
  const fit = new FitClass();
  term.loadAddon(fit);
  term.loadAddon(new LinksClass((event, uri) => bridge.openUrl(uri)));
  term.open(document.getElementById('term'));

  let lastCols = 0, lastRows = 0;
  function doFit() {
    try { fit.fit(); } catch (e) {}
    if (term.cols !== lastCols || term.rows !== lastRows) {
      lastCols = term.cols; lastRows = term.rows;
      bridge.onResize(term.cols, term.rows);
    }
  }
  new ResizeObserver(doFit).observe(document.getElementById('term'));
  term.onData(d => bridge.onInput(d));

  function b64ToBytes(b64) {
    const s = atob(b64);
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
  window.termWrite = b64 => term.write(b64ToBytes(b64));
  window.termReset = () => term.reset();
  window.termFocus = () => term.focus();
  window.termSetFontSize = size => { term.options.fontSize = size; doFit(); };
  window.termSize = () => term.cols + 'x' + term.rows;
  window.termSelection = () => term.getSelection();

  // All URLs in the scrollback; soft-wrapped lines are joined first so long login links stay whole.
  window.termLinks = () => {
    const buf = term.buffer.active;
    const logical = [];
    for (let i = 0; i < buf.length; i++) {
      const line = buf.getLine(i);
      if (!line) continue;
      const text = line.translateToString(true);
      if (line.isWrapped && logical.length) logical[logical.length - 1] += text;
      else logical.push(text);
    }
    const found = [];
    for (const l of logical) {
      for (const m of l.matchAll(/https?:\/\/[^\s"'<>]+/g)) {
        const u = m[0].replace(/[).,;:]+$/, '');
        if (!found.includes(u)) found.push(u);
      }
    }
    return JSON.stringify(found.reverse());
  };

  // ---- Touch scrolling --------------------------------------------------------------------------
  // Swipe = scroll. In the normal buffer xterm's own scrollback is used; when the program on the server
  // tracks the mouse (tmux with "mouse on", vim, less …) the swipe is sent as mouse-wheel events instead,
  // so tmux scrolls through its own history.
  const termEl = document.getElementById('term');
  let lastY = null, acc = 0, moved = false;
  function lineHeight() {
    const row = termEl.querySelector('.xterm-rows > div');
    const h = row ? row.getBoundingClientRect().height : 0;
    return h > 4 ? h : (term.options.fontSize || 13) * 1.2;
  }
  function wheel(lines) {
    const n = Math.min(Math.abs(lines), 15);
    const button = lines < 0 ? 64 : 65;           // 64 = wheel up, 65 = wheel down (SGR encoding)
    const col = Math.max(1, Math.floor(term.cols / 2)), row = Math.max(1, Math.floor(term.rows / 2));
    for (let i = 0; i < n; i++) bridge.onInput('\x1b[<' + button + ';' + col + ';' + row + 'M');
  }
  window.termScroll = lines => {
    const tracking = term.modes && term.modes.mouseTrackingMode && term.modes.mouseTrackingMode !== 'none';
    if (tracking) wheel(lines);
    else if (term.buffer.active.type === 'alternate') {
      const key = lines < 0 ? '\x1b[A' : '\x1b[B';  // no scrollback in full-screen apps: send arrow keys
      for (let i = 0; i < Math.min(Math.abs(lines), 15); i++) bridge.onInput(key);
    } else term.scrollLines(lines);
  };
  termEl.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { lastY = e.touches[0].clientY; acc = 0; moved = false; }
  }, { passive: true, capture: true });
  termEl.addEventListener('touchmove', e => {
    if (lastY === null || e.touches.length !== 1) return;
    const y = e.touches[0].clientY;
    acc += lastY - y; lastY = y;
    const lh = lineHeight();
    const lines = Math.trunc(acc / lh);
    if (lines !== 0) { acc -= lines * lh; moved = true; window.termScroll(lines); }
    if (moved) { e.preventDefault(); e.stopPropagation(); }
  }, { passive: false, capture: true });
  termEl.addEventListener('touchend', () => { lastY = null; }, { capture: true });

  window.termScrollToBottom = () => term.scrollToBottom();

  doFit();
  bridge.onReady(term.cols, term.rows);
  term.focus();
</script>
</body>
</html>
